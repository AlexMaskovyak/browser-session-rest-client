[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "browser-session-rest-client"
version = "0.2.0"
description = "Log into websites and generate standalone Python API clients"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = ["playwright==1.56.0"]

[project.optional-dependencies]
test = ["pytest>=8,<10", "build>=1,<2", "setuptools>=75"]

[project.scripts]
website-client = "website_client.cli:entrypoint"

[tool.setuptools.packages.find]
where = ["python"]

[tool.pytest.ini_options]
testpaths = ["tests_python"]
